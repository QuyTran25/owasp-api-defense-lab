_format_version: "3.0"

# ==============================================================================
# STATE B template — Kong DB-less declarative configuration.
# deploy_state_b.sh renders this template to kong.runtime.yml using the
# deployment-only VAMPI_JWT_SECRET. Do not put a real secret in this file.
# ==============================================================================

consumers:
  - username: vampi-authenticated
    custom_id: vampi-state-b
    acls:
      - group: authenticated
    jwt_secrets:
      # key must equal the `iss` claim VAmPI emits.
      - key: vampi-state-b
        algorithm: HS256
        secret: __VAMPI_JWT_SECRET__

services:
  - name: vampi-service
    url: http://vampi:5000
    routes:
      # Public endpoints remain reachable so a client can obtain a JWT.
      - name: vampi-login-public
        paths:
          - /users/v1/login
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              # Brute-force protection for public authentication endpoints.
              policy: local
              limit_by: ip
              minute: 5
              fault_tolerant: true
              hide_client_headers: false
      - name: vampi-register-public
        paths:
          - /users/v1/register
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              # Registration is also public and receives the same IP quota.
              policy: local
              limit_by: ip
              minute: 5
              fault_tolerant: true
              hide_client_headers: false
      # Every route not explicitly public requires a valid JWT.
      # ACL and rate-limiting are deliberately introduced in W3-KONG-04/05.
      - name: vampi-protected
        paths:
          - /
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
          # Coarse-grained gateway control only. Object ownership and per-user
          # admin authorization remain mandatory backend responsibilities.
          - name: acl
            config:
              allow:
                - authenticated
              hide_groups_header: true
          - name: rate-limiting
            config:
              # One Kong Consumer is shared by all VAmPI users in this lab;
              # use client IP so users do not share one Consumer quota.
              # `local` is intentional for this single-node lab only.
              policy: local
              limit_by: ip
              minute: 60
              fault_tolerant: true
              hide_client_headers: false

